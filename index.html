<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="bundle.js"></script>
  </head>
  <body>
    <main class="app">
      <section class="card">
        <h1>QR Code Generator</h1>
        <p class="subtitle">Paste any webpage URL or any text and turn it into a QR code.</p>

        <form id="qr-form">
          <label for="qr-input" class="sr-only">Page URL or text</label>
          <input
            id="qr-input"
            type="text"
            value="https://example.com"
            placeholder="Paste a webpage URL or any text here"
            autocomplete="off"
          />

          <div class="actions">
            <button type="submit">Generate QR Code</button>
            <button type="button" id="download-btn" class="secondary" disabled>
              Download PNG
            </button>
          </div>
        </form>

        <div class="qr-wrap">
          <canvas id="qr-canvas" width="240" height="240" aria-label="Generated QR code"></canvas>
        </div>

        <p id="status" class="status">Ready</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
